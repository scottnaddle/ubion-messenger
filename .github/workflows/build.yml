name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: desktop } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: desktop/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14          # arm64 runner; builds arm64 + x64 dmg (unsigned)
            script: dist:mac
            artifact: |
              desktop/release/*.dmg
              desktop/release/*.zip
              desktop/release/*.blockmap
              desktop/release/latest-mac.yml
          - os: windows-latest
            script: dist:win
            artifact: |
              desktop/release/*.exe
              desktop/release/*.blockmap
              desktop/release/latest.yml
    runs-on: ${{ matrix.os }}
    defaults: { run: { working-directory: desktop } }
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"   # unsigned builds
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: desktop/package-lock.json }
      - run: npm ci
      - run: npm run ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: UBION-Messenger-${{ runner.os }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
